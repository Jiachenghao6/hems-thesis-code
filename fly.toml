# Fly.io deployment for the study build.
#
# Why Fly: the machine can be pinned to Frankfurt, a persistent volume is included in
# the free allowance, and a single instance can be enforced — all three matter here
# and are awkward on the platforms that autoscale by default.
#
# Rename `app` before the first deploy; the name becomes part of the URL that goes
# into the Prolific study, and it must not change once recruitment starts.

app = "hems-study"
primary_region = "fra"          # Frankfurt — the data stays inside the EU

[build]
  dockerfile = "Dockerfile"
  # The Prolific values are build arguments because Vite inlines them into the bundle.
  # Fill them in after creating the Prolific study, then redeploy.
  [build.args]
    VITE_PROLIFIC_COMPLETION_URL = ""
    VITE_PROLIFIC_COMPLETION_CODE = ""

[env]
  # 2026-10 rerun of condition B only (Wörndl, 05 Oct 2026). The first run's files stay
  # in /data and are only read (PREVIOUS_LEDGER, to flag returning participants); the
  # rerun writes to its own folder. session_service.check_rerun_config() refuses to
  # start if these three are inconsistent. First-run deploy: DATA_DIR = "/data", no
  # STUDY_FORCE_CONDITION, no PREVIOUS_LEDGER.
  DATA_DIR = "/data/rerun_b"
  STUDY_FORCE_CONDITION = "B"
  PREVIOUS_LEDGER = "/data/assignments.jsonl"
  FRONTEND_DIST = "/app/frontend/dist"
  PORT = "8080"

# Collected data lives here. Without a volume the JSONL files sit on the machine's
# ephemeral disk and are erased by every deploy — including the deploy you make to
# fix a typo halfway through data collection.
[[mounts]]
  source = "hems_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true

  # Never scale beyond one machine: the assignment ledger is a file appended to by a
  # single process, and block randomisation counts its rows. Two machines would each
  # keep half the picture and the groups would drift out of balance without any error.
  min_machines_running = 1
  auto_stop_machines = false
  auto_start_machines = false

  # These limits exist to tell Fly when to spread load across machines — and this app
  # deliberately runs on exactly one. Leaving them at 40/60 would mean the proxy starts
  # shedding requests during a burst it could easily serve: a load test against the
  # deployed machine handled 50 simultaneous /api/recommend calls with a 157 ms p95.
  # Raised well above anything 40 participants can produce, since a refused request
  # during the study costs a paid submission.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

# A study that returns 502 to a participant costs a paid submission and a data point,
# so the health check is frequent and the grace period short.
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
